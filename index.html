<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Best In Slot Gear Selector</title>
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
        <style>
            pre {
                background-color: #f8f9fa; /* Light grey background */
                padding: 15px;
                border-radius: 5px;
                white-space: pre-wrap; /* Allow wrapping */
                word-wrap: break-word; /* Ensure long strings break */
                overflow-x: auto; /* Handle overflow */
                font-size: 0.9rem; /* Slightly smaller text */
            }
    
            .card-text {
                font-family: "Courier New", Courier, monospace; /* Use monospaced font */
            }
        </style>
    </head>
    
    <body>
        <div class="container mt-5">
            <h1 class="text-center mb-4">Best In Slot Gear Selector</h1>
    
            <!-- Nav Tabs -->
            <ul class="nav nav-tabs" id="gearTabs" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="selector-tab" href="#" role="tab" onclick="loadTab('gear_selector.html')">Gear Selector</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="gearsets-tab" href="#" role="tab" onclick="loadTab('submitted_gearsets.html')">Submitted Gearsets</a>
                </li>
            </ul>
    
            <!-- Tab Content (Will be loaded dynamically) -->
            <div class="tab-content mt-4" id="tabContent">
                <!-- Content will be loaded here -->
            </div>
        </div>
    
        <script>
            // Function to dynamically load HTML content for each tab
            function loadTab(file) {
                fetch(file)
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('tabContent').innerHTML = data;
    
                        // If gearsets tab is loaded, display the gearsets
                        if (file === 'submitted_gearsets.html') {
                            displayGearsets(); // Load and display saved gearsets
                        }
                    })
                    .catch(err => console.error('Error loading tab content:', err));
            }
    
            // Function to submit the form and store data in localStorage
            function submitForm() {
                const slots = ['weapon', 'head', 'body', 'hands', 'legs', 'feet', 'ear', 'neck', 'wrist', 'TopRing', 'BottomRing']; // All slot IDs
                const selections = {};
    
                // Collect gear selections
                slots.forEach(slot => {
                    const selectionText = document.getElementById(slot + '-selection').innerText;
                    selections[slot] = selectionText.replace('Selected: ', '') || 'None';
                });
    
                // Collect personal information
                const firstName = document.getElementById('firstName').value;
                const lastName = document.getElementById('lastName').value;
                const job = document.getElementById('job').value;
    
                // Combine gear selections and personal info
                const gearset = {
                    firstName: firstName,
                    lastName: lastName,
                    job: job,
                    selections: selections
                };
    
                // Get the current gearsets from localStorage
                let gearsets = JSON.parse(localStorage.getItem('gearsets')) || [];
    
                // Add the new gearset
                gearsets.push(gearset);
    
                // Save back to localStorage
                localStorage.setItem('gearsets', JSON.stringify(gearsets));
    
                // Show the new gearset in the list
                displayGearsets();
            }
    
            // Function to display submitted gearsets
            function displayGearsets() {
                const gearsetList = document.getElementById('gearsetList');
                if (!gearsetList) return; // Prevent errors if gearsetList doesn't exist
                gearsetList.innerHTML = ''; // Clear the current list
    
                // Get the gearsets from localStorage
                const gearsets = JSON.parse(localStorage.getItem('gearsets')) || [];
    
                // Append each gearset to the list
                gearsets.forEach((gearset, index) => {
                    const li = document.createElement('li');
                    li.classList.add('list-group-item', 'mb-3');
    
                    // Create a Bootstrap card for each gearset
                    const card = document.createElement('div');
                    card.classList.add('card');
    
                    const cardBody = document.createElement('div');
                    cardBody.classList.add('card-body');
    
                    const cardTitle = document.createElement('h5');
                    cardTitle.classList.add('card-title');
                    cardTitle.textContent = `Gearset ${index + 1} - ${gearset.firstName} ${gearset.lastName} (${gearset.job})`;
    
                    // Create a div to hold the formatted gearset
                    const gearsetDisplay = document.createElement('div');
                    gearsetDisplay.classList.add('card-text');
                    let formattedGearset = '';
    
                    // Format the gearset with each slot on a new line
                    Object.keys(gearset.selections).forEach(slot => {
                        formattedGearset += `${capitalize(slot)}: ${gearset.selections[slot]}<br>`;
                    });
    
                    gearsetDisplay.innerHTML = formattedGearset;
    
                    // Create a delete button for this gearset
                    const deleteBtn = document.createElement('button');
                    deleteBtn.classList.add('btn', 'btn-danger', 'btn-sm', 'ml-2');
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.onclick = function() {
                        deleteGearset(index);
                    };
    
                    // Append elements together
                    cardBody.appendChild(cardTitle);
                    cardBody.appendChild(gearsetDisplay);
                    cardBody.appendChild(deleteBtn);
                    card.appendChild(cardBody);
                    li.appendChild(card);
    
                    // Append the list item to the gearset list
                    gearsetList.appendChild(li);
                });
            }
    
            // Function to delete a gearset by index
            function deleteGearset(index) {
                // Get the current gearsets from localStorage
                let gearsets = JSON.parse(localStorage.getItem('gearsets')) || [];
    
                // Remove the gearset at the specified index
                gearsets.splice(index, 1);
    
                // Save the updated gearsets array back to localStorage
                localStorage.setItem('gearsets', JSON.stringify(gearsets));
    
                // Update the gearset list display
                displayGearsets();
            }
    
            // Helper function to capitalize the first letter of the slot names
            function capitalize(string) {
                return string.charAt(0).toUpperCase() + string.slice(1);
            }
    
            // Load the default tab on page load
            document.addEventListener('DOMContentLoaded', function() {
                loadTab('gear_selector.html');
            });
        </script>
    
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </body>
</html>
