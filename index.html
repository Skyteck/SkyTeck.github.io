<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Best In Slot Gear Selector</title>
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
        <style>
            pre {
                background-color: #9ea6ad; /* Light grey background */
                padding: 15px;
                border-radius: 5px;
                white-space: pre-wrap; /* Allow wrapping */
                word-wrap: break-word; /* Ensure long strings break */
                overflow-x: auto; /* Handle overflow */
                font-size: 0.9rem; /* Slightly smaller text */
            }
    
            .card-text {
                font-family: "Courier New", Courier, monospace; /* Use monospaced font */
            }
        </style>
    </head>
    
    <body>
        <div class="container mt-5">
            <h1 class="text-center mb-4">Best In Slot Gear Selector</h1>
    
            <!-- Nav Tabs -->
            <ul class="nav nav-tabs" id="gearTabs" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="selector-tab" href="#" role="tab" onclick="loadTab('gear_selector.html')">Gear Selector</a>
                </li>                
                <li class="nav-item">
                    <a class="nav-link" id="currentGear-tab" href="#" role="tab" onclick="loadTab('current_gear.html')">Current Gear</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="gearsets-tab" href="#" role="tab" onclick="loadTab('submitted_gearsets.html')">Submitted Gearsets</a>
                </li>
            </ul>
    
            <!-- Tab Content (Will be loaded dynamically) -->
            <div class="tab-content mt-4" id="tabContent">
                <!-- Content will be loaded here -->
            </div>
        </div>
    
        <script src="https://unpkg.com/@supabase/supabase-js"></script>

        <!-- Initialize Supabase client -->
        <script>
            const supabaseUrl = 'https://xyexgokteqdrfeayvqvm.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5ZXhnb2t0ZXFkcmZlYXl2cXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjYyNDc3MDAsImV4cCI6MjA0MTgyMzcwMH0.jHSn7o93JVA0xU90oDoj-1svYZ0QsObCeFOOYZTKFHQ'; // Replace with your actual anon key
            const supabaseClient  = supabase.createClient(supabaseUrl, supabaseKey);

            // Function to dynamically load HTML content for each tab
            function loadTab(file) {
                fetch(file)
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById('tabContent').innerHTML = data;
    
                        // If gearsets tab is loaded, display the gearsets
                        if (file === 'submitted_gearsets.html') {
                            displayGearsets(); // Load and display saved gearsets
                        }
                    })
                    .catch(err => console.error('Error loading tab content:', err));
            }

            // Function to submit the form and store data in localStorage
            async function submitForm() {
                // Collect personal information
                const firstName = document.getElementById('firstName').value;
                const job = document.getElementById('job').value;
                const tierID = 1; //document.getElementById('TierID').value;

                // Simple validation
                if (!firstName || !job || !tierID) {
                    alert('Please enter your name, select a job, and enter a Tier ID.');
                    return;
                }

                // Collect gear selections
                const gearSlots = ['weapon', 'head', 'chest', 'hands', 'legs', 'feet', 'ear', 'neck', 'wrist', 'TopRing', 'BottomRing'];
                const gearData = {};

                gearSlots.forEach(slot => {
                const selectionElement = document.getElementById(slot + '-selection');
                const selectionText = selectionElement ? selectionElement.innerText : 'Selected: None';
                const selectionValue = selectionText.replace('Selected: ', '') || 'None';

                let numericValue;
                switch (selectionValue) {
                    case 'Raid':
                        numericValue = 0;
                        break;
                    case 'Tome':
                        numericValue = 1;
                        break;
                    case 'Other':
                        numericValue = 2;
                        break;
                    default:
                        numericValue = null; // none chosen
                }

                gearData[slot] = numericValue;
            });


                // Combine all data into one object matching your database schema
                const gearset = {
                    Name: firstName,
                    Job: job,
                    TierID: tierID,
                    weapon: gearData.weapon,
                    head: gearData.head,
                    chest: gearData.chest,
                    hands: gearData.hands,
                    legs: gearData.legs,
                    feet: gearData.feet,
                    ear: gearData.ear,
                    neck: gearData.neck,
                    wrist: gearData.wrist,
                    ring1: gearData.ring1,
                    ring2: gearData.ring2
                };

                // Save to Supabase
                const { data, error } = await supabaseClient
                    .from('Gearsets')
                    .insert({Name: firstName,
                             Job: job,
                             TierID: tierID,
                             Weapon: gearData.weapon,
                             Head: gearData.head,
                             Chest: gearData.chest,
                             Hands: gearData.hands,
                             Legs: gearData.legs,
                             Feet: gearData.feet,
                             Ears: gearData.ear,
                             Neck: gearData.neck,
                             Wrist: gearData.wrist,
                             Ring1: gearData.TopRing,
                             Ring2: gearData.BottomRing
                             });


                if (error) {
                    console.error('Error inserting data:', error);
                    alert('There was an error submitting your gearset.');
                } else {
                    alert('Gearset submitted successfully!');
                    // Reset the form
                    document.getElementById('gearForm').reset();
                    gearSlots.forEach(slot => {
                        const selectionElement = document.getElementById(slot + '-selection');
                        if (selectionElement) selectionElement.innerText = '';
                    });
                    // Navigate to the "Submitted Gearsets" tab
                    loadTab('submitted_gearsets.html');
                }
            }

    
            function selectGear(slot, type) {
                document.getElementById(slot + '-selection').innerText = `Selected: ${type}`;
            }

            // Function to display submitted gearsets
            async function displayGearsets() {
                const gearsetList = document.getElementById('gearsetList');
                if (!gearsetList) return;
                gearsetList.innerHTML = '';

                // Fetch gearsets from Supabase
                const { data: gearsets, error } = await supabaseClient
                .from('Gearsets') // Use the exact table name
                .select(`*`);


                if (error) {
                    console.error('Error fetching data:', error);
                    return;
                }

                // Append each gearset to the list
                gearsets.forEach((gearset) => {
                    const li = document.createElement('li');
                    li.classList.add('list-group-item', 'mb-3');

                    // Create a Bootstrap card for each gearset
                    const card = document.createElement('div');
                    card.classList.add('card');

                    const cardBody = document.createElement('div');
                    cardBody.classList.add('card-body');

                    const cardTitle = document.createElement('h5');
                    cardTitle.classList.add('card-title');
                    cardTitle.textContent = `${gearset.Name} (${gearset.Job}) `;

                    // Create a div to hold the formatted gearset
                    const gearsetDisplay = document.createElement('div');
                    gearsetDisplay.classList.add('card-text');
                    let formattedGearset = '';

                    // List of gear slots
                    const gearSlots = ['Weapon', 'Head', 'Chest', 'Hands', 'Legs', 'Feet', 'Ears', 'Neck', 'Wrist', 'Ring1', 'Ring2'];

                    // Map numeric codes back to selection strings
                    const codeToSelection = {
                        0: 'Raid',
                        1: 'Tome',
                        2: 'Other',
                        null: 'None' // Assuming null represents 'None'
                    };

                    // Format the gearset with each slot on a new line
                    gearSlots.forEach(slot => {
                        const numericValue = gearset[slot];
                        const selection = codeToSelection[numericValue];
                        formattedGearset += `${capitalize(slot)}: ${selection}<br>`;
                    });

                    gearsetDisplay.innerHTML = formattedGearset;

                    // Create a delete button for this gearset
                    const deleteBtn = document.createElement('button');
                    deleteBtn.classList.add('btn', 'btn-danger', 'btn-sm', 'ml-2');
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.onclick = function() {
                        deleteGearset(gearset.id);
                    };

                    // Append elements together
                    cardBody.appendChild(cardTitle);
                    cardBody.appendChild(gearsetDisplay);
                    cardBody.appendChild(deleteBtn);
                    card.appendChild(cardBody);
                    li.appendChild(card);

                    // Append the list item to the gearset list
                    gearsetList.appendChild(li);
                });
            }

    
            // Function to delete a gearset by index
            async function deleteGearset(id) {
                const { error } = await supabaseClient
                    .from('gearsets')
                    .delete()
                    .eq('id', id);

                if (error) {
                    console.error('Error deleting gearset:', error);
                    alert('There was an error deleting the gearset.');
                } else {
                    // Update the gearset list display
                    displayGearsets();
                }
            }

    
            // Helper function to capitalize the first letter of the slot names
            function capitalize(string) {
                return string.charAt(0).toUpperCase() + string.slice(1);
            }
    
            // Load the default tab on page load
            document.addEventListener('DOMContentLoaded', function() {
                loadTab('gear_selector.html');
            });
        </script>
    
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </body>
</html>
